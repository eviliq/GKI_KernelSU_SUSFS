name: Setup Baseband Guard (BBG)
description: Install Baseband Guard from an audited immutable commit

runs:
  using: composite
  steps:
    - name: Install pinned Baseband Guard
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        BBG_COMMIT="a54e0dc6cf0aff4dd87fec49644a02d2eb612905"
        BBG_REPO="https://github.com/vc-teahouse/Baseband-guard.git"
        BBG_DIR="${{ github.workspace }}/kernel/Baseband-guard"
        SETUP_SCRIPT="${RUNNER_TEMP}/bbg-setup-${BBG_COMMIT}.sh"

        rm -rf "$BBG_DIR"
        git clone --no-checkout "$BBG_REPO" "$BBG_DIR"
        git -C "$BBG_DIR" fetch --depth=1 origin "$BBG_COMMIT"
        git -C "$BBG_DIR" checkout --detach --quiet "$BBG_COMMIT"

        ACTUAL_COMMIT="$(git -C "$BBG_DIR" rev-parse HEAD)"
        if [ "$ACTUAL_COMMIT" != "$BBG_COMMIT" ]; then
          echo "BBG commit mismatch: expected $BBG_COMMIT, got $ACTUAL_COMMIT" >&2
          exit 1
        fi

        curl --fail --location --silent --show-error \
          --retry 5 --retry-delay 5 --retry-all-errors \
          "https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/${BBG_COMMIT}/setup.sh" \
          --output "$SETUP_SCRIPT"
        test -s "$SETUP_SCRIPT"
        chmod 0755 "$SETUP_SCRIPT"

        "$SETUP_SCRIPT" "$BBG_COMMIT"

        ACTUAL_COMMIT="$(git -C "$BBG_DIR" rev-parse HEAD)"
        if [ "$ACTUAL_COMMIT" != "$BBG_COMMIT" ]; then
          echo "BBG setup changed source commit: expected $BBG_COMMIT, got $ACTUAL_COMMIT" >&2
          exit 1
        fi

        echo "BBG_COMMIT=$ACTUAL_COMMIT" >> "$GITHUB_ENV"

    - name: Configure Baseband Guard
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

    - name: Verify BBG installation
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        test -L common/security/baseband-guard
        grep -q "baseband_guard" common/security/Kconfig
        grep -q 'obj-$(CONFIG_BBG) += baseband-guard/' common/security/Makefile
        [ "$(git -C Baseband-guard rev-parse HEAD)" = "a54e0dc6cf0aff4dd87fec49644a02d2eb612905" ]
        echo "[+] BBG pinned and integrated"

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_BBG=y
