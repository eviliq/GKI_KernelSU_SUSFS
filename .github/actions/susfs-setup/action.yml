name: 'Setup SUSFS Branch'
description: 'Clone SUSFS at an immutable revision and apply the audited NP03J LTS delta'
inputs:
  susfs_commit:
    description: 'Exact SUSFS base commit SHA'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  root_flavor:
    description: 'Selected root implementation'
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Clone pinned SUSFS and apply audited LTS delta
      shell: bash
      run: |
        set -euo pipefail

        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
        SUSFS_DIR="${{ github.workspace }}/susfs4ksu"
        EXPECTED_BASE="${{ inputs.susfs_commit }}"

        rm -rf "$SUSFS_DIR"

        if [ -n "$EXPECTED_BASE" ]; then
          if ! [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SUSFS commit must be a full 40-character SHA." >&2
            exit 2
          fi

          retry git clone --no-checkout "$SUSFS_REPO" "$SUSFS_DIR"
          retry git -C "$SUSFS_DIR" fetch --depth=1 origin "$EXPECTED_BASE"
          git -C "$SUSFS_DIR" checkout --detach --quiet "$EXPECTED_BASE"
        else
          echo "WARNING: no SUSFS pin supplied; using branch tip $SUSFS_BRANCH" >&2
          retry git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" "$SUSFS_DIR"
          EXPECTED_BASE="$(git -C "$SUSFS_DIR" rev-parse HEAD)"
        fi

        ACTUAL_BASE="$(git -C "$SUSFS_DIR" rev-parse HEAD)"
        if [ "$ACTUAL_BASE" != "$EXPECTED_BASE" ]; then
          echo "SUSFS base mismatch: expected $EXPECTED_BASE, got $ACTUAL_BASE" >&2
          exit 1
        fi

        echo "SUSFS_BASE_COMMIT=$ACTUAL_BASE" >> "$GITHUB_ENV"
        echo "SUSFS_COMMIT=$ACTUAL_BASE" >> "$GITHUB_ENV"
        echo "Using SUSFS base: $ACTUAL_BASE"

        # NP03J target: Android14-6.1 LTS + KernelSU-Next.
        # This three-commit set was independently proven to produce exactly
        # the same tree as pershoot gki-android14-6.1-lts-dev at
        # 79ecabe1aa6f3d0e00668d5a3902879d67652189.
        if [ "${{ inputs.root_flavor }}" = "next" ] && [ "${{ inputs.version }}" = "android14-6.1" ]; then
          PERSHOOT_REPO="https://gitlab.com/pershoot/susfs4ksu.git"
          PERSHOOT_COMMITS=(
            "88df19e864e90f738610b455706931476641b8d9"
            "6d4f9a92ac7946d9d2d1904149d764506c9ae7b9"
            "79ecabe1aa6f3d0e00668d5a3902879d67652189"
          )
          EXPECTED_TREE="b5bab5ca2caf7c828450765f65bf748f399998e6"

          git -C "$SUSFS_DIR" config user.name "github-actions[bot]"
          git -C "$SUSFS_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for commit in "${PERSHOOT_COMMITS[@]}"; do
            echo "Applying pinned Pershoot LTS delta: $commit"
            retry git -C "$SUSFS_DIR" fetch --no-tags "$PERSHOOT_REPO" "$commit"
            git -C "$SUSFS_DIR" cherry-pick "$commit"
          done

          ACTUAL_TREE="$(git -C "$SUSFS_DIR" rev-parse 'HEAD^{tree}')"
          if [ "$ACTUAL_TREE" != "$EXPECTED_TREE" ]; then
            echo "Pershoot LTS tree mismatch: expected $EXPECTED_TREE, got $ACTUAL_TREE" >&2
            exit 1
          fi

          echo "SUSFS_LTS_PATCHSET_HEAD=79ecabe1aa6f3d0e00668d5a3902879d67652189" >> "$GITHUB_ENV"
          echo "SUSFS_LTS_TREE=$ACTUAL_TREE" >> "$GITHUB_ENV"
          echo "Verified Pershoot LTS tree: $ACTUAL_TREE"
        fi
